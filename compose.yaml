# Docker Compose: the whole local environment.
#   docker compose up -d    start everything in the background (or: make up)
#   docker compose down     stop and remove the containers (data volume stays)
# Development-only settings (hot reload, mounted source) live in
# compose.override.yaml, which Compose merges in automatically.

services:
  # PostgreSQL database. Data is kept in the named volume "db-data", so it
  # survives `docker compose down` (only `down -v` deletes it).
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-score}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-score}
      POSTGRES_DB: ${POSTGRES_DB:-score_system}
    volumes:
      - db-data:/var/lib/postgresql/data
    # The healthcheck tells Compose when the database actually accepts
    # connections; "api" waits for it (see depends_on below).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # FastAPI backend, built from backend/Dockerfile.
  api:
    build: ./backend
    environment:
      # Inside the Compose network, containers reach each other by service
      # name, so the database host is simply "db".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-score}:${POSTGRES_PASSWORD:-score}@db:5432/${POSTGRES_DB:-score_system}
    ports:
      - "${API_PORT:-8000}:8000"
    # Start only once the database is healthy.
    depends_on:
      db:
        condition: service_healthy

  # Vue frontend served by the Vite dev server.
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Keep node_modules inside the container (in an anonymous volume), so
      # Linux-built packages never mix with the ones on the host.
      - /app/node_modules
    # Install only when node_modules is missing or older than package-lock.json
    # (npm writes node_modules/.package-lock.json on every install).
    command: sh -c "{ [ node_modules/.package-lock.json -nt package-lock.json ] || npm ci; } && npm run dev -- --host 0.0.0.0"
    environment:
      # The Vite dev server forwards /api requests to the api service.
      API_PROXY_TARGET: http://api:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  db-data:

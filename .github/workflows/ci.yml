name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older, still running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    # PostgreSQL for the integration tests, reachable on localhost:5432.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: score
          POSTGRES_PASSWORD: score
          POSTGRES_DB: score_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U score"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # alembic check runs against this database; the tests use their own.
      DATABASE_URL: postgresql+psycopg://score:score@localhost:5432/score_system
      TEST_DATABASE_URL: postgresql+psycopg://score:score@localhost:5432/score_system_test
      # Property-based tests with a fixed seed, so a failure can be repeated.
      HYPOTHESIS_PROFILE: ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: Models match the migrations
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest --cov=score_system
      - name: Domain coverage
        run: uv run coverage report --include="src/score_system/domain/*" --fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The build also type-checks (vue-tsc), so there is no separate typecheck step.
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      # Image names are <project>-<service>; pin the project so the built image is found.
      COMPOSE_PROJECT_NAME: score_system
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build the api image from compose.yaml with the layer cache kept in GitHub Actions,
      # so unchanged layers (e.g. the dependencies) are not rebuilt on every run.
      - name: Build images
        uses: docker/bake-action@v6
        with:
          source: .
          files: compose.yaml
          load: true
          set: |
            api.tags=score_system-api
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      # Smoke test: the image starts, migrates, seeds and answers requests.
      - name: Start database and API
        run: docker compose -f compose.yaml up -d --no-build --wait db api
      - name: Migrate and seed
        run: |
          docker compose -f compose.yaml exec -T api alembic upgrade head
          docker compose -f compose.yaml exec -T api score seed
      - name: Query the API
        run: |
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8000/api/v1/health
          curl -fsS http://localhost:8000/api/v1/competitions/sample-volleyball-league/standings
      - name: API logs
        if: failure()
        run: docker compose -f compose.yaml logs api
